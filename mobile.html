<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Deadline Defender — Opportunity Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Base reset & fonts */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { width: 100%; min-height: 100vh; background: #0A121D; color: #E9EEF5; }
    body { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    /* ------------------------------------------------------------------ */
    /*  Icon helper                                                       */
    /* ------------------------------------------------------------------ */
    const ICONS_SVG_PATH = {
      Home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
      Star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
      Sparkles: '<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>',
      Flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3.5z"/>',
      Bookmark: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>',
      CheckCircle2: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
      Bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
      User: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
      Menu: '<line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>',
      X: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
      ChevronRight: '<path d="m9 18 6-6-6-6"/>',
      ShieldCheck: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
      ShieldQuestion: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
      ShieldAlert: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
      ExternalLink: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
      Info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
      Search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
      MapPin: '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
      GraduationCap: '<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>',
      Radar: '<path d="M19.07 4.93a10 10 0 0 0-14.14 0"/><path d="M16.24 7.76a6 6 0 0 0-8.49 0"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/>',
      Clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
      ArrowUpRight: '<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
      Check: '<path d="M20 6 9 17l-5-5"/>',
      Circle: '<circle cx="12" cy="12" r="10"/>'
    };

    function Icon({ name, size = 16, strokeWidth = 2, className = "", style = {}, fill = "none", ...props }) {
      const pathHtml = ICONS_SVG_PATH[name] || '<circle cx="12" cy="12" r="10"/>';
      return (
        <svg
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill={fill}
          stroke="currentColor"
          strokeWidth={strokeWidth}
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
          style={{ display: 'inline-block', verticalAlign: 'middle', flexShrink: 0, ...style }}
          dangerouslySetInnerHTML={{ __html: pathHtml }}
          {...props}
        />
      );
    }

    const Home = (p) => <Icon name="Home" {...p} />;
    const Star = (p) => <Icon name="Star" {...p} />;
    const Sparkles = (p) => <Icon name="Sparkles" {...p} />;
    const Flame = (p) => <Icon name="Flame" {...p} />;
    const Bookmark = (p) => <Icon name="Bookmark" {...p} />;
    const CheckCircle2 = (p) => <Icon name="CheckCircle2" {...p} />;
    const Bell = (p) => <Icon name="Bell" {...p} />;
    const User = (p) => <Icon name="User" {...p} />;
    const Menu = (p) => <Icon name="Menu" {...p} />;
    const X = (p) => <Icon name="X" {...p} />;
    const ChevronRight = (p) => <Icon name="ChevronRight" {...p} />;
    const ShieldCheck = (p) => <Icon name="ShieldCheck" {...p} />;
    const ShieldQuestion = (p) => <Icon name="ShieldQuestion" {...p} />;
    const ShieldAlert = (p) => <Icon name="ShieldAlert" {...p} />;
    const ExternalLink = (p) => <Icon name="ExternalLink" {...p} />;
    const Info = (p) => <Icon name="Info" {...p} />;
    const Search = (p) => <Icon name="Search" {...p} />;
    const MapPin = (p) => <Icon name="MapPin" {...p} />;
    const GraduationCap = (p) => <Icon name="GraduationCap" {...p} />;
    const Radar = (p) => <Icon name="Radar" {...p} />;
    const Clock = (p) => <Icon name="Clock" {...p} />;
    const ArrowUpRight = (p) => <Icon name="ArrowUpRight" {...p} />;
    const Check = (p) => <Icon name="Check" {...p} />;
    const Circle = (p) => <Icon name="Circle" {...p} />;

    /* ------------------------------------------------------------------ */
    /*  Constants & Options                                               */
    /* ------------------------------------------------------------------ */
    const INTEREST_OPTIONS = [
      "Artificial Intelligence",
      "Cybersecurity",
      "Government Exams",
      "Data Science",
      "Web Development",
      "Civil Services",
      "Robotics",
      "Finance",
      "Design",
      "Research",
    ];

    const OPP_TYPE_OPTIONS = [
      "Internships",
      "Government Jobs",
      "Scholarships",
      "Hackathons",
      "Certifications",
      "Fellowships",
    ];

    const EDUCATION_OPTIONS = [
      "Below 10th",
      "10th",
      "12th",
      "Diploma",
      "Undergraduate",
      "Postgraduate",
      "Graduate / Job seeker",
    ];

    const initialReminderPrefs = { 30: false, 14: true, 7: true, 3: true, 1: true, 0: true };

    const NAV_ITEMS = [
      { key: "home", label: "Home", Icon: Home },
      { key: "recommended", label: "Recommended", Icon: Star },
      { key: "new", label: "New", Icon: Sparkles },
      { key: "closing", label: "Closing soon", Icon: Flame },
      { key: "saved", label: "Saved", Icon: Bookmark },
      { key: "applied", label: "Applied", Icon: CheckCircle2 },
      { key: "reminders", label: "Reminders", Icon: Bell },
      { key: "profile", label: "Profile", Icon: User },
    ];

    /* ------------------------------------------------------------------ */
    /*  Helper Functions                                                  */
    /* ------------------------------------------------------------------ */
    function urgency(daysLeft) {
      if (daysLeft <= 1) return "critical";
      if (daysLeft <= 7) return "soon";
      return "safe";
    }

    function trustMeta(trust) {
      if (trust === "official")
        return { label: "Official source", Icon: ShieldCheck, cls: "trust-official" };
      if (trust === "verified")
        return { label: "Verified secondary", Icon: ShieldCheck, cls: "trust-verified" };
      return { label: "Unverified — confirm before applying", Icon: ShieldQuestion, cls: "trust-unverified" };
    }

    function eligIcon(status) {
      if (status === "match") return <Check size={13} strokeWidth={3} />;
      if (status === "warn") return <span className="dot-warn" />;
      return <span className="dot-missing" />;
    }

    /* ------------------------------------------------------------------ */
    /*  Root Application Component                                        */
    /* ------------------------------------------------------------------ */
    function DeadlineDefenderApp() {
      const [currentUser, setCurrentUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'signup'

      const [stage, setStage] = useState("app"); // "onboarding" | "app"
      const [onboardStep, setOnboardStep] = useState(0);

      const [interests, setInterests] = useState([]);
      const [oppTypes, setOppTypes] = useState(["Internships", "Scholarships", "Government Jobs"]);
      const [education, setEducation] = useState("");
      const [city, setCity] = useState("");
      const [customInterest, setCustomInterest] = useState("");

      const [activeNav, setActiveNav] = useState("home");
      const [mobileNavOpen, setMobileNavOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [opportunities, setOpportunities] = useState([]);
      const [evidenceId, setEvidenceId] = useState(null);
      const [reminderPrefs, setReminderPrefs] = useState(initialReminderPrefs);
      const [reminderLog, setReminderLog] = useState([]);
      const [toastMessage, setToastMessage] = useState(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 2500);
      };

      // Load initial state from backend
      const loadData = useCallback(async () => {
        try {
          const pRes = await fetch('/api/user/profile', { credentials: 'include' });
          if (!pRes.ok) {
            setAuthModalOpen(true);
            setLoading(false);
            return;
          }

          const uData = await pRes.json();
          setCurrentUser(uData);
          setAuthModalOpen(false);

          if (uData.interests) setInterests(uData.interests);
          if (uData.oppTypes && uData.oppTypes.length) setOppTypes(uData.oppTypes);
          if (uData.education) setEducation(uData.education);
          if (uData.city) setCity(uData.city);
          if (uData.reminderPrefs) setReminderPrefs(uData.reminderPrefs);

          if (uData.needsOnboarding) {
            setStage("onboarding");
          } else {
            setStage("app");
          }

          // Fetch opportunities and reminder log in parallel
          const [oRes, rRes] = await Promise.all([
            fetch('/api/opportunities', { credentials: 'include' }),
            fetch('/api/reminders/log', { credentials: 'include' })
          ]);

          if (oRes.ok) {
            const oData = await oRes.json();
            setOpportunities(oData.opportunities || []);
          }

          if (rRes.ok) {
            const rData = await rRes.json();
            setReminderLog(rData.log || []);
          }
        } catch (err) {
          console.error("App init error:", err);
          setAuthModalOpen(true);
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => {
        loadData();
      }, [loadData]);

      const toggle = (list, setList, value) =>
        setList(list.includes(value) ? list.filter((v) => v !== value) : [...list, value]);

      const addCustomInterest = () => {
        const val = customInterest.trim();
        if (!val) return;
        if (!interests.includes(val)) {
          setInterests([...interests, val]);
          showToast(`Added "${val}" to interests`);
        }
        setCustomInterest("");
      };

      // Save profile changes to backend
      const saveProfileToBackend = async (payload) => {
        try {
          const res = await fetch('/api/user/profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            showToast("Profile saved & radar updated ✓");
            await loadData();
          }
        } catch (err) {
          console.error("Save profile error:", err);
        }
      };

      // Complete Onboarding
      const handleFinishOnboarding = async () => {
        const payload = {
          interests,
          oppTypes,
          education,
          city
        };
        try {
          const res = await fetch('/api/user/onboarding', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            setStage("app");
            showToast("Welcome! Your radar is now active ⚡");
            await loadData();
          }
        } catch (err) {
          console.error("Onboarding finish error:", err);
          setStage("app");
        }
      };

      // Toggle Opportunity Track Status (Save / Apply)
      const handleSetOppStatus = async (id, status) => {
        // Optimistic UI update
        setOpportunities(prev => prev.map(o => {
          if (o.id === id) {
            if (status === 'saved') return { ...o, saved: !o.saved };
            if (status === 'applied') return { ...o, applied: !o.applied };
          }
          return o;
        }));

        const targetOpp = opportunities.find(o => o.id === id);
        const newStatus = status === 'saved'
          ? (targetOpp?.saved ? 'unseen' : 'saved')
          : (targetOpp?.applied ? 'unseen' : 'applied');

        try {
          await fetch('/api/opportunities/track', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ opportunityId: id, status: newStatus })
          });
          showToast(newStatus === 'saved' ? "Saved to radar ✓" : newStatus === 'applied' ? "Marked as Applied ✓" : "Updated ✓");
        } catch (err) {
          console.error("Track error:", err);
        }
      };

      // Update Reminder Preferences
      const handleSetReminderPrefs = async (newPrefs) => {
        setReminderPrefs(newPrefs);
        try {
          await fetch('/api/reminders/prefs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ prefs: newPrefs })
          });
          showToast("Reminder preferences updated");
        } catch (err) {
          console.error("Reminder prefs error:", err);
        }
      };

      // Calculate confidence & profile completion
      const confidence = useMemo(() => {
        const hasEdu = !!education;
        const hasCity = !!city;
        const hasInterests = interests.length > 0;
        if (hasEdu && hasCity && hasInterests) return "high";
        if (hasInterests && (hasEdu || hasCity)) return "partial";
        return "interest-only";
      }, [education, city, interests]);

      const profileCompletion = useMemo(() => {
        const fields = [interests.length > 0, oppTypes.length > 0, !!education, !!city];
        const done = fields.filter(Boolean).length;
        return Math.round((done / fields.length) * 100);
      }, [interests, oppTypes, education, city]);

      const evidenceOpp = opportunities.find((o) => o.id === evidenceId) || null;

      // Filtered lists
      const filteredOpps = useMemo(() => {
        if (!searchQuery.trim()) return opportunities;
        const q = searchQuery.toLowerCase();
        return opportunities.filter(o => 
          (o.title || '').toLowerCase().includes(q) ||
          (o.org || '').toLowerCase().includes(q) ||
          (o.category || '').toLowerCase().includes(q)
        );
      }, [opportunities, searchQuery]);

      const closingSoon = useMemo(() => 
        filteredOpps.filter((o) => o.daysLeft <= 7).sort((a, b) => a.daysLeft - b.daysLeft),
        [filteredOpps]
      );
      const recommended = useMemo(() => 
        [...filteredOpps].sort((a, b) => b.matchScore - a.matchScore),
        [filteredOpps]
      );
      const fresh = useMemo(() => filteredOpps.filter((o) => o.isNew), [filteredOpps]);
      const saved = useMemo(() => filteredOpps.filter((o) => o.saved), [filteredOpps]);
      const applied = useMemo(() => filteredOpps.filter((o) => o.applied), [filteredOpps]);

      const handleResetUsers = async () => {
        if (!confirm("⚠️ Are you sure you want to delete all test user accounts and start 100% fresh?")) return;
        try {
          const res = await fetch('/api/dev/reset-all-users', { method: 'POST' });
          const d = await res.json();
          alert(d.message || "Database reset successfully!");
          window.location.reload();
        } catch (err) {
          alert("Reset failed: " + err.message);
        }
      };

      const handleLogout = async () => {
        await fetch('/auth/logout', { method: 'POST', credentials: 'include' });
        setCurrentUser(null);
        setAuthModalOpen(true);
      };

      return (
        <div className="dd-root">
          <GlobalStyle />
          
          {stage === "onboarding" ? (
            <Onboarding
              step={onboardStep}
              setStep={setOnboardStep}
              interests={interests}
              toggleInterest={(v) => toggle(interests, setInterests, v)}
              oppTypes={oppTypes}
              toggleOppType={(v) => toggle(oppTypes, setOppTypes, v)}
              education={education}
              setEducation={setEducation}
              city={city}
              setCity={setCity}
              customInterest={customInterest}
              setCustomInterest={setCustomInterest}
              addCustomInterest={addCustomInterest}
              finish={handleFinishOnboarding}
            />
          ) : (
            <div className="shell">
              <Sidebar
                active={activeNav}
                setActive={(k) => {
                  setActiveNav(k);
                  setMobileNavOpen(false);
                }}
                counts={{ closing: closingSoon.length, new: fresh.length, saved: saved.length, applied: applied.length }}
                mobileOpen={mobileNavOpen}
                closeMobile={() => setMobileNavOpen(false)}
              />
              <main className="main">
                <Topbar
                  onMenu={() => setMobileNavOpen(true)}
                  completion={profileCompletion}
                  onProfile={() => setActiveNav("profile")}
                  searchQuery={searchQuery}
                  setSearchQuery={setSearchQuery}
                  username={currentUser?.username}
                />
                <div className="content">
                  {activeNav === "home" && (
                    <HomeView
                      closingSoon={closingSoon}
                      recommended={recommended.slice(0, 6)}
                      savedCount={saved.length}
                      onEvidence={setEvidenceId}
                      onSave={(id) => handleSetOppStatus(id, 'saved')}
                      onApply={(id) => handleSetOppStatus(id, 'applied')}
                      goTo={setActiveNav}
                    />
                  )}
                  {activeNav === "recommended" && (
                    <ListView
                      title="Recommended for you"
                      subtitle="Ranked by how well each opportunity fits your interests and profile."
                      items={recommended}
                      onEvidence={setEvidenceId}
                      onSave={(id) => handleSetOppStatus(id, 'saved')}
                      onApply={(id) => handleSetOppStatus(id, 'applied')}
                    />
                  )}
                  {activeNav === "new" && (
                    <ListView
                      title="New opportunities"
                      subtitle="Discovered since your last visit."
                      items={fresh}
                      onEvidence={setEvidenceId}
                      onSave={(id) => handleSetOppStatus(id, 'saved')}
                      onApply={(id) => handleSetOppStatus(id, 'applied')}
                    />
                  )}
                  {activeNav === "closing" && (
                    <ListView
                      title="Closing soon"
                      subtitle="Sorted by the least time remaining. Act on these first."
                      items={closingSoon}
                      onEvidence={setEvidenceId}
                      onSave={(id) => handleSetOppStatus(id, 'saved')}
                      onApply={(id) => handleSetOppStatus(id, 'applied')}
                      emphasize
                    />
                  )}
                  {activeNav === "saved" && (
                    <ListView
                      title="Saved"
                      subtitle="Opportunities you're keeping an eye on."
                      items={saved}
                      onEvidence={setEvidenceId}
                      onSave={(id) => handleSetOppStatus(id, 'saved')}
                      onApply={(id) => handleSetOppStatus(id, 'applied')}
                      emptyLabel="Nothing saved yet — tap the bookmark on any card to keep track of it here."
                    />
                  )}
                  {activeNav === "applied" && (
                    <ListView
                      title="Applied"
                      subtitle="Marking an opportunity applied cancels its remaining reminders."
                      items={applied}
                      onEvidence={setEvidenceId}
                      onSave={(id) => handleSetOppStatus(id, 'saved')}
                      onApply={(id) => handleSetOppStatus(id, 'applied')}
                      emptyLabel="Nothing marked applied yet."
                    />
                  )}
                  {activeNav === "reminders" && (
                    <RemindersView
                      prefs={reminderPrefs}
                      setPrefs={handleSetReminderPrefs}
                      log={reminderLog}
                      onRefreshReminders={loadData}
                    />
                  )}
                  {activeNav === "profile" && (
                    <ProfileView
                      username={currentUser?.username}
                      email={currentUser?.email}
                      interests={interests}
                      toggleInterest={(v) => toggle(interests, setInterests, v)}
                      customInterest={customInterest}
                      setCustomInterest={setCustomInterest}
                      addCustomInterest={addCustomInterest}
                      oppTypes={oppTypes}
                      toggleOppType={(v) => toggle(oppTypes, setOppTypes, v)}
                      education={education}
                      setEducation={setEducation}
                      city={city}
                      setCity={setCity}
                      completion={profileCompletion}
                      confidence={confidence}
                      onSave={() => saveProfileToBackend({ interests, oppTypes, education, city })}
                      onResetAllUsers={handleResetUsers}
                      onLogout={handleLogout}
                    />
                  )}
                </div>
              </main>
            </div>
          )}

          {evidenceOpp && <EvidenceModal opp={evidenceOpp} onClose={() => setEvidenceId(null)} />}

          {/* Auth Modal (when unauthenticated) */}
          {authModalOpen && (
            <AuthModal
              mode={authMode}
              setMode={setAuthMode}
              onSuccess={() => { setAuthModalOpen(false); loadData(); }}
              onResetAllUsers={handleResetUsers}
            />
          )}

          {/* Toast Notification */}
          {toastMessage && (
            <div className="toast-pill">
              <CheckCircle2 size={16} />
              <span>{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /*  Onboarding Component                                              */
    /* ------------------------------------------------------------------ */
    function Onboarding({

    function MatchDial({ score = 85 }) {
      const r = 16;
      const c = 2 * Math.PI * r;
      const offset = c - (score / 100) * c;
      return (
        <svg width="40" height="40" viewBox="0 0 40 40" className="match-dial">
          <circle cx="20" cy="20" r={r} className="dial-track" />
          <circle
            cx="20"
            cy="20"
            r={r}
            className="dial-fill"
            strokeDasharray={c}
            strokeDashoffset={offset}
            transform="rotate(-90 20 20)"
          />
        </svg>
      );
    }

    /* ------------------------------------------------------------------ */
    /*  Auth Modal Component                                              */
    /* ------------------------------------------------------------------ */
    function AuthModal({ mode, setMode, onSuccess, onResetAllUsers }) {
      const [username, setUsername] = useState("");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError("");
        setLoading(true);

        const endpoint = mode === 'signup' ? '/auth/signup' : '/auth/login';
        const payload = mode === 'signup' ? { username, email, password } : { username, password };

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload)
          });
          const data = await res.json();

          .completion-bar { flex: 1; height: 7px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; }
          .completion-fill { height: 100%; background: linear-gradient(90deg, var(--violet), var(--safe)); border-radius: 4px; transition: width .3s; }
          .completion-row span { font-size: 13px; font-weight: 600; color: var(--text-muted); }
          .confidence-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 6px 12px; border-radius: 20px; }
          .conf-high { background: rgba(53,217,178,0.12); color: var(--safe); }
          .conf-partial { background: rgba(255,182,72,0.12); color: var(--soon); }
          .conf-low { background: rgba(139,124,255,0.12); color: var(--violet); }

          /* ---------- Responsive ---------- */
          @media (max-width: 860px) {
            .mobile-only { display: inline-flex; }
            .sidebar {
              position: fixed; z-index: 40; left: 0; top: 0; transform: translateX(-100%);
              transition: transform .2s ease; box-shadow: 0 0 40px rgba(0,0,0,0.5);
            }
            .sidebar-open { transform: translateX(0); }
            .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 39; }
            .content { padding: 20px 16px 50px; }
            .topbar { padding: 14px 16px; }
            .hero { flex-direction: column; align-items: stretch; }
            .hero-stats { justify-content: space-between; }
            .card-grid { grid-template-columns: 1fr; }
          }
        `}</style>
      );
    }

    /* Mount the application */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DeadlineDefenderApp />);
  </script>
</body>

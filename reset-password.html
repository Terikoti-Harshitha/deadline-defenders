<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deadline Defender - Set New Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@500;600;700&family=Cabinet+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #080a0e; color: #dce4f5; min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      position: relative; overflow: hidden;
    }
    body::before {
      content: ''; position: absolute; inset: -50%;
      background:
        radial-gradient(circle at 20% 40%, rgba(245, 166, 35, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(232, 96, 28, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 50% 10%, rgba(0, 196, 140, 0.08) 0%, transparent 40%);
      animation: pulseGlow 12s ease infinite alternate;
    }
    @keyframes pulseGlow {
      0% { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.1) rotate(4deg); }
    }
    .container {
      background: rgba(19, 23, 32, 0.85); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      padding: 2.75rem 2.25rem; border-radius: 24px; width: 420px; max-width: 90vw;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(245, 166, 35, 0.15);
      text-align: center; position: relative; z-index: 1;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      width: 52px; height: 52px; background: linear-gradient(135deg, #f5a623 0%, #e8601c 100%);
      border-radius: 14px 14px 14px 4px; margin: 0 auto 1.25rem; display: flex;
      align-items: center; justify-content: center; font-size: 24px;
      box-shadow: 0 8px 24px rgba(245, 166, 35, 0.35);
    }
    h2 {
      font-family: 'Clash Display', sans-serif; font-size: 1.85rem; font-weight: 700;
      letter-spacing: -0.02em; margin-bottom: 0.35rem; color: #ffffff;
    }
    .subtitle { color: #6b7a96; margin-bottom: 1.75rem; font-size: 0.95rem; }
    .input-group { position: relative; margin-bottom: 1.25rem; text-align: left; }
    label {
      display: block; color: #9aa3b8; font-size: 0.8rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.5rem;
    }
    input {
      width: 100%; padding: 0.95rem 1.15rem; background: #131720;
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; outline: none;
      font-family: inherit; font-size: 0.95rem; color: #dce4f5; transition: all 0.25s ease;
    }
    input:focus {
      border-color: #f5a623; background: #1a2030;
      box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15);
    }
    input::placeholder { color: #3a4558; }
    button {
      width: 100%; padding: 1rem; background: linear-gradient(135deg, #f5a623 0%, #e8601c 100%);
      border: none; border-radius: 14px; font-family: 'Clash Display', sans-serif; font-weight: 700;
      font-size: 0.95rem; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;
      color: #080a0e; transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); margin-top: 0.5rem;
      box-shadow: 0 6px 20px rgba(245, 166, 35, 0.3);
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(245, 166, 35, 0.45); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .message {
      padding: 0.85rem; border-radius: 10px; margin-bottom: 1.25rem; font-size: 0.88rem; display: none;
    }
    .message.error { background: rgba(232, 96, 28, 0.12); border: 1px solid rgba(232, 96, 28, 0.3); color: #ff9a7a; }
    .message.success { background: rgba(0, 196, 140, 0.12); border: 1px solid rgba(0, 196, 140, 0.3); color: #4dffc4; }
    .message.show { display: block; }
    .invalid-token { text-align: center; padding: 1.5rem; color: #ff9a7a; }
    .footer-text { margin-top: 1.75rem; color: #6b7a96; font-size: 0.9rem; }
    a { color: #f5a623; text-decoration: none; font-weight: 700; }
    a:hover { color: #ffca6b; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🔑</div>
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your new secure password</p>

    <div id="msg" class="message"></div>

    <div id="formSection">
      <form id="resetForm">
        <div class="input-group">
          <label for="password">New Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" />
        </div>
        <div class="input-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" placeholder="Repeat your new password" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" id="submitBtn">Set New Password →</button>
      </form>
    </div>

    <p class="footer-text"><a href="/mobile.html">← Back to Login</a></p>
  </div>

  <script>
    const form        = document.getElementById('resetForm');
    const msgDiv      = document.getElementById('msg');
    const submitBtn   = document.getElementById('submitBtn');
    const formSection = document.getElementById('formSection');

    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');

    if (!token) {
      formSection.innerHTML = `<p class="invalid-token">⚠️ Invalid or missing reset token.<br><a href="forgot-password.html">Request a new one</a></p>`;
    }

    form && form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgDiv.className = 'message';
      msgDiv.textContent = '';

      const password        = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        msgDiv.textContent = 'Passwords do not match.';
        msgDiv.className = 'message error show';
        return;
      }
      if (password.length < 6) {
        msgDiv.textContent = 'Password must be at least 6 characters.';
        msgDiv.className = 'message error show';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting...';

      try {
        const res = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();

        if (res.ok) {
          msgDiv.textContent = 'Password reset successfully! Redirecting to app...';
          msgDiv.className = 'message success show';
          form.style.display = 'none';
          setTimeout(() => { window.location.href = '/mobile.html'; }, 2000);
        } else {
          msgDiv.textContent = data.error || 'Reset failed. The link may have expired.';
          msgDiv.className = 'message error show';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Set New Password →';
        }
      } catch (_) {
        msgDiv.textContent = 'Network error — please try again.';
        msgDiv.className = 'message error show';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Set New Password →';
      }
    });
  </script>
</body>
</html>

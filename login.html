<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deadline Defender - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@500;600;700&family=Cabinet+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #080a0e;
      color: #dce4f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: -50%;
      background:
        radial-gradient(circle at 20% 40%, rgba(245, 166, 35, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(232, 96, 28, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 50% 10%, rgba(0, 196, 140, 0.08) 0%, transparent 40%);
      animation: pulseGlow 12s ease infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.1) rotate(4deg); }
    }

    .container {
      background: rgba(19, 23, 32, 0.85);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      padding: 2.75rem 2.25rem;
      border-radius: 24px;
      width: 420px;
      max-width: 90vw;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(245, 166, 35, 0.15);
      text-align: center;
      position: relative;
      z-index: 1;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #f5a623 0%, #e8601c 100%);
      border-radius: 14px 14px 14px 4px;
      margin: 0 auto 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 8px 24px rgba(245, 166, 35, 0.35);
    }

    h2 {
      font-family: 'Clash Display', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
      color: #ffffff;
    }

    .subtitle {
      color: #6b7a96;
      margin-bottom: 1.75rem;
      font-size: 0.95rem;
    }

    .input-group {
      position: relative;
      margin-bottom: 1.25rem;
      text-align: left;
    }

    label {
      display: block;
      color: #9aa3b8;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      padding: 0.95rem 1.15rem;
      background: #131720;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      outline: none;
      font-family: inherit;
      font-size: 0.95rem;
      color: #dce4f5;
      transition: all 0.25s ease;
    }

    input:focus {
      border-color: #f5a623;
      background: #1a2030;
      box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15);
    }

    input::placeholder {
      color: #3a4558;
    }

    button {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #f5a623 0%, #e8601c 100%);
      border: none;
      border-radius: 14px;
      font-family: 'Clash Display', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      color: #080a0e;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-top: 0.5rem;
      box-shadow: 0 6px 20px rgba(245, 166, 35, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(245, 166, 35, 0.45);
    }

    button:active {
      transform: scale(0.97);
    }

    .error {
      background: rgba(232, 96, 28, 0.12);
      border: 1px solid rgba(232, 96, 28, 0.3);
      color: #ff9a7a;
      padding: 0.85rem;
      border-radius: 10px;
      margin-bottom: 1.25rem;
      font-size: 0.88rem;
      display: none;
      animation: shake 0.3s ease;
    }

    .error.show {
      display: block;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      30% { transform: translateX(-6px); }
      70% { transform: translateX(6px); }
    }

    .footer-text {
      margin-top: 1.75rem;
      color: #6b7a96;
      font-size: 0.9rem;
    }

    a {
      color: #f5a623;
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s ease;
    }

    a:hover {
      color: #ffca6b;
      text-decoration: underline;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0 1.25rem;
      color: #3a4558;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    .divider::before { margin-right: 1rem; }
    .divider::after { margin-left: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">⚡</div>
    <h2>Welcome Back</h2>
    <p class="subtitle">Log in to manage your upcoming deadlines</p>

    <div id="error" class="error"></div>

    <form id="loginForm">
      <div class="input-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" placeholder="e.g. alex or alex@example.com" required autocomplete="username" />
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
      </div>

      <button type="submit" id="loginBtn">Sign In →</button>
    </form>

    <p style="margin-top: 1rem; text-align: right;">
      <a href="forgot-password.html" style="font-size: 0.85rem;">Forgot password?</a>
    </p>

    <div class="divider">OR</div>

    <p class="footer-text">Don't have an account? <a href="signup.html">Create one now</a></p>
    <p style="margin-top: 1rem; text-align: center;"><a href="#" onclick="promptResetAllUsers();return false" style="font-size: 0.8rem; color: #8a99b5; text-decoration: underline;">🧹 Reset Test Users &amp; Start Fresh</a></p>
  </div>

  <script>
    async function promptResetAllUsers(){
      if(!confirm('⚠️ Are you sure you want to delete ALL existing users, profiles, and reminders to start 100% fresh?')) return;
      try {
        const res = await fetch('/api/dev/reset-all-users', { method: 'POST' });
        const d = await res.json();
        alert(d.message || 'Database reset successfully!');
        window.location.href = '/signup.html';
      } catch(err) {
        alert('Reset failed: ' + err.message);
      }
    }

    const form = document.getElementById('loginForm');
    const errorDiv = document.getElementById('error');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.textContent = '';
      errorDiv.classList.remove('show');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          errorDiv.textContent = data.error || 'Invalid username or password';
          errorDiv.classList.add('show');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Sign In →';
          return;
        }

        // Clean redirect to main web application
        window.location.href = '/mobile.html';
      } catch (err) {
        errorDiv.textContent = 'Network error — please check your connection';
        errorDiv.classList.add('show');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In →';
      }
    });
  </script>
</body>
</html>
